<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANTRICK Discovery</title>
<style>
:root{
  --paper:#0C0B0E; --paper2:#12161C; --ink:#F6DFC5; --mid:#8E96A3; --line:#2A3544; --line2:#1D2837; --slate:#3F4E62; --rust:#A55134; --teal:#5B908E; --cyan:#62C9D6;
  --sig:#F1B255; --sig-d:#F1B255; --blue:#5B908E; --ok:#5B908E; --bad:#C25B3A;
  --f-disp:'Bahnschrift','Segoe UI Variable Display','Segoe UI','Tahoma',sans-serif;
  --f-body:'Segoe UI','Tahoma',sans-serif; --f-mono:'Cascadia Mono','Consolas',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;font-size:17px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#bg{position:fixed;inset:0;z-index:0;background:
  linear-gradient(var(--line2) 1px,transparent 1px) calc(var(--mx,0)*-14px) calc(var(--my,0)*-14px)/48px 48px,
  linear-gradient(90deg,var(--line2) 1px,transparent 1px) calc(var(--mx,0)*-14px) calc(var(--my,0)*-14px)/48px 48px,
  radial-gradient(1200px 700px at 78% 8%,#FFFFFF 0,transparent 60%),var(--paper);transition:filter 1.2s}
body.dim #bg{filter:brightness(.84) saturate(.8)}
#top{position:fixed;inset-inline:0;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:20px;padding-inline:28px}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.18em;font-size:17px;display:flex;align-items:center;gap:12px}
.brand i{display:block;width:10px;height:10px;background:var(--sig);border-radius:50%}
.brand small{letter-spacing:.04em;font-weight:500;color:var(--mid);font-size:14px}
#prog{flex:1;display:flex;gap:5px;max-width:560px;margin-inline:auto}
#prog button{flex:1;height:26px;display:flex;align-items:center}
#prog button span{display:block;width:100%;height:3px;background:var(--line);transition:background .5s,height .3s}
#prog button.done span{background:var(--ink)} #prog button.cur span{background:var(--sig);height:5px} #prog button:disabled{cursor:default}
.tools{display:flex;gap:10px;align-items:center}
.pill{height:38px;padding-inline:16px;border:1.5px solid var(--ink);font-size:15px;font-weight:600;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:var(--paper2)}
.seg{display:flex;border:1.5px solid var(--ink)} .seg button{height:35px;padding-inline:14px;font-size:15px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper2)}
#stage{position:fixed;inset:64px 0 0 0;z-index:5}
.scene{position:absolute;inset:0;padding:12px 48px 32px;overflow:auto;animation:in .7s var(--ease) both}
.scene.wsc{padding:0;overflow:hidden}
.scene.out{animation:out .45s var(--ease) both;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateX(calc(var(--dir,1)*40px)) scale(.992)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(calc(var(--dir,1)*-40px))}}
.rv{opacity:0;transform:translateY(22px);animation:rv .8s var(--ease) forwards;animation-delay:calc(var(--i,0)*90ms + 120ms)}
@keyframes rv{to{opacity:1;transform:none}}
h1,h2{font-family:var(--f-disp);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.eyebrow{font-family:var(--f-mono);font-size:13px;color:var(--mid);letter-spacing:.06em;display:flex;gap:12px;align-items:center}
.eyebrow b{color:var(--sig-d)}
.lead{font-size:clamp(18px,1.7vw,24px);color:var(--mid);max-width:34ch;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:14px;height:54px;padding-inline:24px;background:var(--sig);color:var(--ink);font-weight:700;font-size:18px;transition:transform .25s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px);background:#EFC987}
.btn svg{width:20px;height:20px;transition:transform .3s var(--ease)}
[dir=rtl] .btn svg{transform:scaleX(-1)} [dir=rtl] .btn:hover svg{transform:scaleX(-1) translateX(5px)} .btn:hover svg{transform:translateX(5px)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink)} .btn.ghost:hover{background:var(--ink);color:var(--paper2)}
.btn:disabled{opacity:.35;pointer-events:none}
a.btn{text-decoration:none}

/* intro */
.intro{display:grid;place-items:center;text-align:center;height:100%}
.intro .wrap{max-width:900px;width:100%}
.wordmark{font-size:clamp(64px,11vw,150px);letter-spacing:-.04em;font-family:var(--f-disp);font-weight:700;direction:ltr;display:flex;justify-content:center;overflow:hidden;padding-bottom:.08em}
.wordmark span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + 500ms)}
@keyframes rise{to{transform:none}}
.trace{width:100%;max-width:820px;height:40px;margin:6px auto 22px;display:block;direction:ltr}
.trace path{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2s .2s var(--ease) forwards}
.trace circle{fill:var(--sig);opacity:0;animation:pop .4s 2.1s forwards;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.intro .lead{margin:0 auto 30px;max-width:46ch}

/* world */
.world{position:absolute;inset:0;overflow:hidden;background:radial-gradient(900px 500px at 50% 40%,#fff,transparent 70%)}
.world>svg{direction:ltr;width:100%;height:100%;display:block;transition:transform 1.2s var(--ease),opacity .8s;touch-action:manipulation}
.veil{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .8s}
.veil.on{opacity:1}
.cap{position:absolute;inset-inline:0;top:22px;text-align:center;font-family:var(--f-mono);font-size:14px;letter-spacing:.14em;color:var(--mid);pointer-events:none;transition:opacity .6s}
.hud{position:absolute;inset-block-start:14px;inset-inline-start:24px;z-index:8;background:var(--paper2);border:1.5px solid var(--ink);padding:12px 16px;min-width:250px;max-width:340px;font-size:15px}
.hud h4{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--mid);margin-bottom:8px;font-weight:600}
.hud div{display:flex;gap:10px;align-items:center;padding:4px 0;opacity:.45;transition:opacity .3s}
.hud div.on{opacity:1;font-weight:600} .hud div.done{opacity:.7;text-decoration:line-through}
.hud i{width:12px;height:12px;border:2px solid var(--ink);flex:none} .hud div.done i{background:var(--ok);border-color:var(--ok)} .hud div.on i{background:var(--sig);border-color:var(--sig)}
.dlg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(880px,calc(100% - 36px));background:var(--paper2);border:1.5px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:20px 24px;z-index:12;animation:dlgin .45s var(--ease) both;max-height:calc(100% - 40px);overflow:auto}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
.dlg .who{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-family:var(--f-mono);font-size:13px;color:var(--mid)}
.dlg .who i{width:14px;height:14px;display:block;border-radius:50%} .dlg .who b{font-family:var(--f-disp);font-size:20px;color:var(--ink)}
.dlg .txt{font-size:clamp(18px,1.7vw,23px);line-height:1.55;min-height:3.2em;max-width:60ch}
.dlg .txt::after{content:'';display:inline-block;width:2px;height:1em;background:var(--sig);margin-inline-start:4px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
.dlg .txt.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.dlg .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pdesc{min-height:3em;font-size:17px;margin-top:6px;color:var(--ink)}
.part{cursor:pointer} .part rect{fill:#fff;stroke:var(--ink);stroke-width:2.5;transition:fill .3s} .part.on rect{fill:#FFE3D6;stroke:var(--sig)} .part.seen text.chk{opacity:1}
.part text{font-family:var(--f-disp);font-size:17px;font-weight:700;fill:var(--ink)} .part text.chk{opacity:0;fill:var(--ok);font-size:20px}
.explainer{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(620px,94%);background:var(--paper2);border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);z-index:11;animation:dlgin .6s var(--ease) both}
.explainer .ex-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1.5px solid var(--ink);font-family:var(--f-mono);font-size:13px}
.explainer .ex-b{padding:14px 18px 18px;display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.explainer h3{font-family:var(--f-disp);font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.explainer p{color:var(--mid);line-height:1.5}
.dots{display:flex;gap:6px;padding:0 18px 16px} .dots i{flex:1;height:4px;background:var(--line)} .dots i.on{background:var(--sig)}
.prompt{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper2);padding:12px 22px;font-size:18px;font-weight:600;z-index:9;animation:dlgin .6s var(--ease) both;white-space:nowrap}
div.alert{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:12px 22px;font-weight:700;z-index:9;animation:dlgin .5s var(--ease) both;display:flex;gap:12px;align-items:center}
div.alert i{width:12px;height:12px;background:#fff;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,.85fr);gap:22px;height:100%}
.benchL{display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet{position:relative;border:1.5px solid var(--ink);background:var(--paper2);flex:1;min-height:400px}
.sheet svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;direction:ltr;unicode-bidi:isolate}
.sheet .corner{position:absolute;width:14px;height:14px;border:1.5px solid var(--ink)}
.corner.a{inset-block-start:-1.5px;inset-inline-start:-1.5px;border-width:3px 0 0 3px} .corner.b{inset-block-end:-1.5px;inset-inline-end:-1.5px;border-width:0 3px 3px 0}
.benchR{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.card{border:1.5px solid var(--ink);background:var(--paper2);padding:16px}
.card h3{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--mid);letter-spacing:.05em;margin-bottom:10px}
.hyp{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1.5px solid var(--line2);width:100%;text-align:start}
.hyp:first-of-type{border-top:0}
.hyp .r{width:20px;height:20px;border:2px solid var(--ink);border-radius:50%;flex:none;display:grid;place-items:center}
.hyp.sel .r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--sig)}
.hyp .t{flex:1;font-weight:600;line-height:1.3}
.st{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1.5px solid var(--line);color:var(--mid);white-space:nowrap}
.st.ruled{border-color:var(--ink);color:var(--ink);text-decoration:line-through}
.st.sup{border-color:var(--sig);background:var(--sig);color:var(--ink);animation:flash .8s}
@keyframes flash{from{box-shadow:0 0 0 0 rgba(255,90,31,.7)}to{box-shadow:0 0 0 14px rgba(255,90,31,0)}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sm{height:42px;padding-inline:16px;border:1.5px solid var(--ink);font-weight:600;font-size:15px;transition:background .2s,color .2s}
.sm:hover{background:var(--ink);color:var(--paper2)} .sm.pri{background:var(--sig);border-color:var(--sig)} .sm.pri:hover{background:var(--ink);border-color:var(--ink)} .sm:disabled{opacity:.35;pointer-events:none}
.log{max-height:170px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:2px}
.log div{display:flex;gap:10px;padding:6px 0;border-top:1.5px solid var(--line2);animation:rv .5s var(--ease) both} .log div:first-child{border-top:0}
.log time{font-family:var(--f-mono);color:var(--mid);flex:none;min-width:38px;direction:ltr}
.banner{border:1.5px solid var(--bad);color:#8A1226;background:#FDECEF;padding:13px 15px;font-size:15.5px;line-height:1.5;animation:rv .5s var(--ease) both}
.banner.ok{border-color:var(--ok);color:#075F45;background:#E4F6EF}
.hintbar{font-size:15px;color:var(--mid);min-height:24px}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15.5px;opacity:.6} .check.ok{opacity:1;font-weight:600} .check i{width:16px;height:16px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px} .check.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
input[type=range]{width:100%;accent-color:var(--sig)}
.term{fill:var(--paper2);stroke:var(--ink);stroke-width:2.5} .term.hit{stroke:var(--sig);stroke-width:5}
.flowline{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 14;stroke-linecap:round;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.handle{cursor:grab} .probe{cursor:grab}
.pulseS{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
text.t2{font-family:var(--f-mono);font-size:13px;fill:var(--mid)}
.lesson{position:absolute;inset:0;z-index:30;background:rgba(232,235,238,.84);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow:auto;animation:in .5s var(--ease) both}
.lesson .box{width:min(1100px,100%);background:var(--paper2);border:1.5px solid var(--ink);display:grid;grid-template-columns:1.1fr 1fr;box-shadow:14px 14px 0 var(--ink)}
.lesson .viz{border-inline-end:1.5px solid var(--ink);min-height:340px} .lesson .viz svg{width:100%;height:100%;direction:ltr;unicode-bidi:isolate}
.lesson .txt{padding:24px;display:flex;flex-direction:column;gap:10px}
.lesson h2{font-size:clamp(24px,2.6vw,36px)}
.lstep{display:flex;gap:14px;padding:10px 0;border-top:1.5px solid var(--line2);opacity:.4;transition:opacity .4s;cursor:pointer;text-align:start;width:100%}
.lstep.on{opacity:1} .lstep b{font-family:var(--f-mono);color:var(--sig-d);width:24px;flex:none} .lstep span{line-height:1.45}
.tink{border:1.5px dashed var(--ink);padding:12px 14px;font-size:15px;line-height:1.55}
.tink b{font-family:var(--f-mono);font-size:12px;color:var(--sig-d);display:block;margin-bottom:4px}
/* arduino */
.ard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:22px;height:100%}
.code{font-family:var(--f-mono);font-size:15px;line-height:1.9;direction:ltr;text-align:left;background:var(--ink);color:#C8D2E2;padding:14px 16px;overflow:auto}
.code div{padding-inline:6px;border-inline-start:3px solid transparent;transition:background .15s} .code div.run{background:#2A3550;border-inline-start-color:var(--sig);color:#fff}
.code .k{color:#8FA8FF} .code .n{color:#F1B255} .code .c{color:#7B8AA5}
/* result */
.result{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:start}
.result h1{font-size:clamp(38px,5vw,76px)}
.big{display:grid;place-items:center;aspect-ratio:1/1;max-width:400px;width:100%;border:1.5px solid var(--ink);background:var(--paper2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);margin-block:20px}
.stats div{padding:14px;border-inline-start:1.5px solid var(--ink)} .stats div:first-child{border-inline-start:0}
.stats b{font-family:var(--f-disp);font-size:42px;display:block;line-height:1} .stats small{color:var(--mid);font-size:14px}
.timeline{display:flex;flex-direction:column}
.timeline div{display:flex;gap:16px;padding:9px 0;border-top:1.5px solid var(--line);font-size:16px;animation:rv .6s var(--ease) both;animation-delay:calc(var(--i)*70ms + 300ms)}
.timeline time{font-family:var(--f-mono);color:var(--mid);min-width:46px;direction:ltr;text-align:start}
.disc{font-size:14px;color:var(--mid);margin-top:14px;max-width:58ch}
/* TORQ lens */
#torq{position:fixed;inset-block-end:20px;inset-inline-end:24px;z-index:25;width:76px;height:76px;cursor:pointer;border-radius:50%}
#torq svg{width:100%;height:100%;overflow:visible}
#torq .ring{fill:none;stroke:var(--ink);stroke-width:3;transition:stroke .4s} #torq .halo{fill:var(--paper2);stroke:var(--ink);stroke-width:2}
#torq .iris{fill:var(--ink);transition:fill .4s} #torq .arc{fill:none;stroke:var(--sig);stroke-width:4;stroke-linecap:round;stroke-dasharray:30 200;opacity:0;transform-origin:50% 50%}
#torq.think .arc{opacity:1;animation:spin 1.1s linear infinite} #torq.alert .ring{stroke:var(--bad)} #torq.alert .iris{fill:var(--bad)} #torq.good .ring{stroke:var(--ok)} #torq.good .iris{fill:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
#torq .lid{fill:var(--paper2);transform-origin:50% 50%;animation:blinkl 6s infinite} @keyframes blinkl{0%,96%,100%{transform:scaleY(0)}98%{transform:scaleY(1)}}
#torq .pupil{transition:transform .12s linear}
#hint{position:fixed;inset-block-end:30px;inset-inline-end:110px;z-index:25;max-width:340px;background:var(--ink);color:var(--paper2);padding:13px 17px;font-size:15.5px;line-height:1.5;opacity:0;transform:translateY(8px);transition:.4s var(--ease);pointer-events:none}
#hint.show{opacity:1;transform:none}
@media (max-width:900px){
  .scene{padding:8px 16px 90px}#top{padding-inline:12px;gap:8px}.brand small{display:none}
  .bench,.result,.lesson .box,.ard,.explainer .ex-b{grid-template-columns:1fr}.sheet{min-height:300px}
  .lesson .viz{border-inline-end:0;border-bottom:1.5px solid var(--ink);min-height:240px}.hud{min-width:0;max-width:60%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.wordmark span{transform:none}.trace path{stroke-dashoffset:0}.trace circle{opacity:1}}

/* ===== cinematic design system ===== */
#bg{background:radial-gradient(1100px 760px at 82% -12%,rgba(224,200,150,.17),transparent 62%),radial-gradient(900px 600px at 8% 112%,rgba(80,100,110,.16),transparent 60%),linear-gradient(#11161A,#090B0D)}
#bg::after{content:'';position:absolute;inset:-10%;background:linear-gradient(108deg,transparent 26%,rgba(236,222,180,.05) 33%,transparent 41%,transparent 53%,rgba(236,222,180,.035) 58%,transparent 66%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(5%) skewX(-3deg)}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.085;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:59;box-shadow:inset 0 0 200px 30px rgba(0,0,0,.6)}
.world{background:radial-gradient(900px 560px at 50% 36%,#2A3238,#080A0C 80%)}
.veil{background:#080A0C}
.btn{color:#17120A;font-weight:700}.btn.ghost{color:var(--ink);border-color:#5B6670}.btn:hover{background:#EFC987}.btn.ghost:hover{background:var(--ink);color:#0B0E10}
.sm.pri{color:#17120A}.sm.pri:hover{color:var(--ink)}.st.sup{color:#17120A}
.pill,.seg{border-color:#4A545B}.seg button[aria-pressed=true],.pill:hover{color:#0B0E10}
.dlg,.explainer,.lesson .box,.hud,.card,.chans,.pane{background:rgba(20,25,29,.94);border-color:#343E45}
.dlg,.explainer,.lesson .box{box-shadow:0 26px 80px rgba(0,0,0,.7)}
.dlg{backdrop-filter:blur(8px)}
.lesson{background:rgba(4,6,8,.8)}
.prompt{background:rgba(20,25,29,.92);color:var(--ink);border:1px solid #55616A}
div.alert{background:#7E2A1F;color:#FFE9E0}
.sheet{background:#0A0D0F;background-image:linear-gradient(rgba(140,150,156,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,150,156,.07) 1px,transparent 1px);background-size:40px 40px;border-color:#343E45}
.sheet .corner{border-color:#F1B255}
.sheet svg text.t2{fill:#8C969C}
.ex-b svg{background:#0D1114;border:1px solid #2B3238}
.lesson .viz{background:#0A0D0F}
.card svg{background:#0D1114;border:1px solid #2B3238}

  reset();
  const el=()=>Math.round((Date.now()-s.t0)/1000), push=(type,d={})=>s.log.push({type,at:el(),...d});
  const potential=n=>n==='B+'||n==='B-'?POT[n]:(s.wires.red===n?9:0), isFixed=()=>s.wires.red==='C+'&&s.wires.black==='C-';
  return{get s(){return s},reset,isFixed,el,
    fact(k){if(!s.facts.has(k)){s.facts.add(k);push('fact',{k})}},
    probe(c,n){s.probes[c]=n},
    reading(){const{red,black}=s.probes;if(!red||!black||red===black)return null;return potential(red)-potential(black)},
    commitMeasure(){const v=this.reading();if(v===null)return null;const{red,black}=s.probes,last=[...s.log].reverse().find(e=>e.type==='measure'),pair=[red,black].sort().join();
      if(!(last&&last.red===red&&last.black===black&&last.v===v)){push('measure',{red,black,v});s.measures++}
      if(pair==='B+,B-')s.checks.battery=true; if(pair==='C+,C-'){s.checks.board=true;s.lastBoard=v} return v},
    progCheck(){push('prog');s.checks.program=true},
    status(h){if(h==='bat')return s.checks.battery?'ruled':'untested';if(h==='code')return s.checks.program?'ruled':'untested';if(h==='wire')return(s.lastBoard!==null&&s.lastBoard<0)?'sup':'untested'},
    diagnose(h){const ok=h==='wire';push('diag',{h,ok});if(!ok)s.wrong++;else s.diagnosed=true;return ok},
    moveWire(c,n){const o=c==='red'?'black':'red',from=s.wires[c];if(from===n)return;if(s.wires[o]===n)s.wires[o]=from;s.wires[c]=n;push('wire',{color:c,node:n})},

    upload(d){s.uploads++;push('upload',{d})}, hint(){s.hints++;push('hint')},
    batteryRead(){return s.log.some(e=>e.type==='measure'&&e.red==='B+'&&e.black==='B-'&&e.v===9)},

     const a=I.pt(n.x,n.y),b=I.pt(tx,ty);if(Math.abs(b[0]-a[0])>.3)n.face=b[0]>a[0]?1:-1;
     if(d<=sp){n.x=tx;n.y=ty;n.path.shift();if(!n.path.length){n.moving=false;const r=n.res;n.res=null;r&&r()}}else{n.x+=dx/d*sp;n.y+=dy/d*sp}}},

    const horizon=H/2-F*Math.tan(.2),g=ctx.createLinearGradient(0,0,0,Math.max(10,horizon+2));g.addColorStop(0,'#171a28');g.addColorStop(.6,'#3d3040');g.addColorStop(1,'#7a5440');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=`rgb(${fogC[0]},${fogC[1]},${fogC[2]})`;ctx.fillRect(0,Math.max(0,horizon),W,H);
    {const sg=ctx.createRadialGradient(W/2,horizon,4,W/2,horizon,H*.55);sg.addColorStop(0,'rgba(255,190,110,.55)');sg.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H)}
    const dep=f=>{const c=f.p[0];return Math.hypot(c[0]-cam.x,c[2]-cam.z)};
    ground.sort((a,b)=>dep(b)-dep(a));for(const f of ground)drawFace(f);
    pathQ.sort((a,b)=>dep(b)-dep(a));for(const f of pathQ)drawFace(f);
    chevrons();shadow();
    const open=S.done?Math.min(1,S.dt0/.7):0,dyn=[{c:[S.x,.9,S.z],f:charFaces(),char:1}];
    {const w2=2.3*(1-open);dyn.push({c:[0,2.5,35.5],f:boxF(-2.3,0,35.5,w2,5.2,.12,'#6B4527').concat(boxF(2.3-w2,0,35.5,w2,5.2,.12,'#6B4527'))})}
    const all=groups.concat(dyn).map(g=>({g,z:tx(g.c[0],g.c[1],g.c[2])[2]+(g.char?-.4:0)}));all.sort((a,b)=>b.z-a.z);
    for(const o of all){const g=o.g;if(o.z<-8)continue;const fs=g.f.slice().sort((a,b)=>dep(b)-dep(a));for(const f of fs)drawFace(f);g.after&&g.after(tx)}
    ctx.save();ctx.globalCompositeOperation='lighter';for(const gl of glows){const p=proj(gl[0],gl[1],gl[2]);if(!p||p[2]>70)continue;const r=F/p[2]*1.5,rg=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);rg.addColorStop(0,'rgba(255,200,110,.38)');rg.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=rg;ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2)}
    {const p=proj(0,2.4,35.4);if(p){const r=F/p[2]*5.5,rg=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);rg.addColorStop(0,`rgba(98,201,214,${(.30+.12*Math.sin(S.t*2)).toFixed(2)})`);rg.addColorStop(1,'rgba(98,201,214,0)');ctx.fillStyle=rg;ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2)}}ctx.restore();
    {const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
    raf=requestAnimationFrame(frame)};
  Goal.set([L.ar.walkFactory,L.en.walkFactory]);
  window.__a3={S,cam,sc};
  raf=requestAnimationFrame(frame);
  return()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',resize);Goal.set(null)};
};

/* ============================================================ boot */
function restart(){Snd.setMood('calm');PW.v=0;PW.target=0;Mission.reset();Object.assign(Prog,{met:{t:false,c:false,k:false},partsDone:false,alarm:false,lobbyIntro:false,briefed:false,storyDone:false,reported:false,fixed:false,reviewed:false,walked:false});Chat.reset();Av.x=6;Av.y=8.4;Av.path=[];Player.name='';Player.age=null;benchPhase='learn';go('intro',-1)}
$('#restart').onclick=restart;
$$('.seg button').forEach(b=>b.onclick=()=>{if(lang===b.dataset.l)return;lang=b.dataset.l;applyLang();const keep=current;if(cleanup){cleanup();cleanup=null}clearTimers();const old=$('.scene',stage);old&&old.remove();
  const sc=document.createElement('section');sc.className='scene '+keep+((['facade','lobby','robo'].includes(keep))?' wsc':'');stage.appendChild(sc);cleanup=Scenes[keep](sc)||null;renderProg()});
Chat.init();Snd.init();Hints.init();Help.init();(()=>{const g=document.createElement('div');g.id='goal';g.hidden=true;g.innerHTML='<i>➜</i><span></span>';document.body.appendChild(g)})();

applyLang();go('intro');
</script>
